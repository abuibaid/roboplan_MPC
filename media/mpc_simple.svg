<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1000 240" width="1000" height="240" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box { stroke-width: 1.8; }
      .title { font-size: 19px; font-weight: bold; fill: #222; }
      .text { font-size: 14px; fill: #444; }
      .label { font-size: 14px; fill: #555; font-style: italic; }
      .edge { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="20" y="60" width="190" height="90" rx="10" fill="#ffffff" stroke="#555"/>
  <text class="title" x="115" y="98" text-anchor="middle">Target pose</text>
  <text class="text" x="115" y="124" text-anchor="middle">where the tool should go</text>

  <rect class="box" x="270" y="60" width="190" height="90" rx="10" fill="#eef4fb" stroke="#3a6ea5"/>
  <text class="title" x="365" y="98" text-anchor="middle">OInK</text>
  <text class="text" x="365" y="124" text-anchor="middle">pose → joint goal, once</text>

  <rect class="box" x="510" y="45" width="210" height="135" rx="10" fill="#f2f8ee" stroke="#4c8a3a"/>
  <text class="title" x="615" y="75" text-anchor="middle">MPC</text>
  <text class="text" x="615" y="98" text-anchor="middle">plans accelerations, 1.5 s</text>
  <rect x="528" y="114" width="174" height="52" rx="7" fill="#ffffff" stroke="#4c8a3a" stroke-width="1.4"/>
  <text x="615" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b22">Pinocchio</text>
  <text class="text" x="615" y="156" text-anchor="middle">torque of each acceleration</text>

  <rect class="box" x="770" y="60" width="190" height="90" rx="10" fill="#f7f7f7" stroke="#999" stroke-dasharray="6 4"/>
  <text class="title" x="865" y="98" text-anchor="middle">Robot</text>
  <text class="text" x="865" y="124" text-anchor="middle">follows the plan (JTC)</text>

  <path class="edge" d="M210,105 L268,105"/>
  <path class="edge" d="M460,105 L508,105"/>
  <text class="label" x="484" y="92" text-anchor="middle">goal</text>
  <path class="edge" d="M720,105 L768,105"/>
  <text class="label" x="744" y="92" text-anchor="middle">plan</text>
  <path class="edge" d="M865,150 L865,225 L615,225 L615,182"/>
  <text class="label" x="740" y="250" text-anchor="middle">measured joint state, every 0.1 s</text>
</svg>
